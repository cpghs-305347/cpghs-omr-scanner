<script>
/* ============================================================================
 * CPGHS OMR SCANNER & ANALYTICS — CLIENT ENGINE (v21.2 PWA + Zero-Trust PIN)
 * ============================================================================ */

let deferredInstallPrompt = null;
let cvReady = false;
let sessionToken = sessionStorage.getItem('CPGHS_SESSION_TOKEN') || '';
let sessionRole = sessionStorage.getItem('CPGHS_SESSION_ROLE') || '';
let allKeysCache = JSON.parse(localStorage.getItem('CPGHS_KEYS_CACHE') || '[]');
let allStudentsCache = JSON.parse(localStorage.getItem('CPGHS_STUDENTS_CACHE') || '[]');
let scanHistory = JSON.parse(localStorage.getItem('CPGHS_SCAN_HISTORY') || '[]');
let currentPayload = null;
let pendingDuplicatePayload = null;
let loadedImage = null;
let cornerPoints = [];
let draggingCornerIdx = -1;
let showingPinView = false;
let lastAnalyticsData = null;
let itemChartInstance = null;
let compChartInstance = null;
let rankChartInstance = null;

// ============================================================================
// 1. PWA SERVICE WORKER & DIRECT ONE-TAP INSTALL (ANDROID / DESKTOP / iOS)
// ============================================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}

function isIosDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isStandaloneMode() {
  return window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const headerBtn = document.getElementById('headerInstallBtn');
  const settingsBtn = document.getElementById('installPwaBtn');
  if (headerBtn) headerBtn.style.display = 'inline-block';
  if (settingsBtn) settingsBtn.style.display = 'block';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const headerBtn = document.getElementById('headerInstallBtn');
  const settingsBtn = document.getElementById('installPwaBtn');
  if (headerBtn) headerBtn.style.display = 'none';
  if (settingsBtn) settingsBtn.style.display = 'none';
  showCenterModal('success', '✅', 'App Installed!', 'CPGHS OMR is now installed on your device and works offline.');
});

async function triggerPwaInstall() {
  if (isStandaloneMode()) {
    showCenterModal('success', '✅', 'Already Installed', 'You are already running CPGHS OMR in full-screen app mode.');
    return;
  }

  // Direct one-tap install on Chrome / Edge / Android
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') {
      deferredInstallPrompt = null;
    }
    return;
  }

  // iOS Safari (Apple enforces Share -> Add to Home Screen at the OS level)
  if (isIosDevice()) {
    const isSafari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
    const msg = isSafari
      ? 'Apple iOS requires a quick 2-tap install:<br><br>1. Tap the <strong>Share icon (⬆️)</strong> at the bottom of Safari.<br>2. Scroll down and tap <strong>"Add to Home Screen"</strong>, then tap <strong>Add</strong>.'
      : 'Please open this page in <strong>Apple Safari</strong>, then tap the <strong>Share icon (⬆️) → "Add to Home Screen"</strong> to install it as a standalone app.';
    showCenterModal('info', '🍎', 'Install on iPhone / iPad', msg);
    return;
  }

  // Fallback for desktop/mobile browsers when prompt was already dismissed
  showCenterModal(
    'info',
    '📲',
    'Install CPGHS OMR App',
    'Open your browser menu (<strong>⋮</strong> or <strong>⋯</strong>) and tap <strong>"Install app"</strong> or <strong>"Add to Home screen"</strong>.'
  );
}

function openInstallAppGuide() {
  triggerPwaInstall();
}

// ============================================================================
// 2. INITIALIZATION & ZERO-TRUST SERVER PIN AUTHENTICATION
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
  if (isStandaloneMode()) {
    const headerBtn = document.getElementById('headerInstallBtn');
    if (headerBtn) headerBtn.style.display = 'none';
  }

  const savedUrl = localStorage.getItem('CPGHS_GAS_URL') || '';
  const urlInput = document.getElementById('gasUrlInput');
  if (urlInput && savedUrl) urlInput.value = savedUrl;

  if (sessionToken) {
    document.getElementById('pinLockScreen').style.display = 'none';
    populateExamDropdowns();
    renderScanHistory();
    syncKeysAndStudentsFromGoogle(false);
  }

  if (document.getElementById('tosCompetencyList').children.length === 0) {
    addTosCompetencyRow();
  }
});

function onOpenCvReady() {
  cvReady = true;
  const badge = document.getElementById('cvStatus');
  if (badge) {
    badge.textContent = 'Vision Engine Ready';
    badge.classList.add('ready');
  }
}

function getGasUrl() {
  return (localStorage.getItem('CPGHS_GAS_URL') || document.getElementById('gasUrlInput').value || '').trim();
}

async function verifyTeacherPin() {
  const pin = document.getElementById('pinUnlockInput').value.trim();
  const errEl = document.getElementById('pinErrorMsg');
  errEl.textContent = '';

  if (!pin) {
    errEl.textContent = 'Please enter your Security PIN.';
    return;
  }

  const gasUrl = getGasUrl();
  if (!gasUrl) {
    // Allow initial setup access if Web App URL has not been configured yet
    if (pin === '2026' || pin === '202699') {
      sessionToken = 'LOCAL_INIT_SESSION';
      sessionRole = pin === '202699' ? 'admin' : 'user';
      document.getElementById('pinLockScreen').style.display = 'none';
      switchTab('settings', document.querySelectorAll('.nav-btn')[3]);
      showCenterModal('warning', '⚙️', 'Connect Google Sheet', 'Please paste your Google Apps Script Web App URL in Setup to enable server authentication.');
      return;
    }
    errEl.textContent = 'Invalid PIN (Configure Web App URL in Setup).';
    return;
  }

  errEl.style.color = '#2563eb';
  errEl.textContent = 'Verifying PIN with server...';

  try {
    const res = await fetch(`${gasUrl}?action=verifyPin&pin=${encodeURIComponent(pin)}`);
    const json = await res.json();
    if (json.status === 'success' && json.token) {
      sessionToken = json.token;
      sessionRole = json.role || 'user';
      sessionStorage.setItem('CPGHS_SESSION_TOKEN', sessionToken);
      sessionStorage.setItem('CPGHS_SESSION_ROLE', sessionRole);
      document.getElementById('pinUnlockInput').value = '';
      errEl.textContent = '';
      document.getElementById('pinLockScreen').style.display = 'none';
      populateExamDropdowns();
      renderScanHistory();
      syncKeysAndStudentsFromGoogle(false);
    } else {
      errEl.style.color = '#dc2626';
      errEl.textContent = json.message || 'Invalid Security PIN.';
    }
  } catch (e) {
    errEl.style.color = '#dc2626';
    errEl.textContent = 'Network error verifying PIN. Check connection.';
  }
}

function lockAppNow() {
  sessionToken = '';
  sessionRole = '';
  sessionStorage.removeItem('CPGHS_SESSION_TOKEN');
  sessionStorage.removeItem('CPGHS_SESSION_ROLE');
  document.getElementById('pinLockScreen').style.display = 'flex';
}

// ============================================================================
// 3. TAB NAVIGATION & CENTERED MODAL HELPERS
// ============================================================================
function switchTab(tabName, btnEl) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach((b) => b.classList.remove('active'));
  const target = document.getElementById('view-' + tabName);
  if (target) target.classList.add('active');
  if (btnEl) btnEl.classList.add('active');

  if (tabName === 'analytics') {
    loadAnalytics();
  }
}

function showCenterModal(type, icon, title, htmlMsg) {
  const backdrop = document.getElementById('centerModalBackdrop');
  const box = document.getElementById('centerModalBox');
  box.className = 'center-modal-box ' + (type || '');
  document.getElementById('centerModalIcon').textContent = icon || 'ℹ️';
  document.getElementById('centerModalTitle').textContent = title || 'Notice';
  document.getElementById('centerModalMsg').innerHTML = htmlMsg || '';
  backdrop.classList.add('open');
}

function closeCenterModal() {
  document.getElementById('centerModalBackdrop').classList.remove('open');
}

// ============================================================================
// 4. GOOGLE SHEETS SYNC (KEYS, STUDENTS & EXAM DROPDOWNS)
// ============================================================================
function saveGasUrl() {
  const url = document.getElementById('gasUrlInput').value.trim();
  if (!url.startsWith('https://script.google.com/')) {
    showCenterModal('danger', '❌', 'Invalid URL', 'Please enter a valid Google Apps Script Web App URL starting with https://script.google.com/');
    return;
  }
  localStorage.setItem('CPGHS_GAS_URL', url);
  syncKeysAndStudentsFromGoogle(true);
}

async function syncKeysAndStudentsFromGoogle(showAlert) {
  const gasUrl = getGasUrl();
  if (!gasUrl || !sessionToken || sessionToken === 'LOCAL_INIT_SESSION') return;

  try {
    const res = await fetch(`${gasUrl}?action=getKeys&token=${encodeURIComponent(sessionToken)}`);
    const json = await res.json();
    if (json.status === 'unauthorized') {
      lockAppNow();
      return;
    }
    if (json.status === 'success') {
      allKeysCache = json.keys || [];
      allStudentsCache = json.students || [];
      localStorage.setItem('CPGHS_KEYS_CACHE', JSON.stringify(allKeysCache));
      localStorage.setItem('CPGHS_STUDENTS_CACHE', JSON.stringify(allStudentsCache));
      populateExamDropdowns();
      if (showAlert) {
        showCenterModal('success', '✅', 'Sync Complete', `Synced ${allKeysCache.length} Exam Keys and ${allStudentsCache.length} Students.`);
      }
    }
  } catch (e) {
    if (showAlert) {
      showCenterModal('danger', '⚠️', 'Sync Failed', 'Could not reach Google Sheets. Working in offline mode.');
    }
  }
}

function populateExamDropdowns() {
  const badge = document.getElementById('studentCountBadge');
  if (badge) badge.textContent = allStudentsCache.length;

  const selectors = ['examSelect', 'analyticsExamSelect', 'tosExamId'];
  selectors.forEach((id) => {
    const sel = document.getElementById(id);
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- Select Exam ID --</option>';
    allKeysCache.forEach((k) => {
      const opt = document.createElement('option');
      opt.value = k.examId;
      opt.textContent = `${k.examId} (${k.subject} - ${k.examType})`;
      sel.appendChild(opt);
    });
    if (prev) sel.value = prev;
  });
}

function onExamSelected() {
  const examId = document.getElementById('examSelect').value;
  const keyMeta = allKeysCache.find((k) => k.examId === examId);
  if (keyMeta && keyMeta.examType) {
    document.getElementById('sectionMode').value = keyMeta.examType;
  }
  document.getElementById('historyExamLabel').textContent = examId || 'All Exams';
  renderScanHistory();
}

// ============================================================================
// 5. PHOTO CAPTURE, QR READ, CORNER ADJUSTMENT & OMR GRADING
// ============================================================================
function triggerPhotoCapture() {
  const examId = document.getElementById('examSelect').value;
  if (!examId) {
    showCenterModal('warning', '📋', 'Select Exam First', 'Please choose a Saved Exam Key before capturing an answer sheet.');
    return;
  }
  document.getElementById('photoFileInput').click();
}

function handlePhotoUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      document.getElementById('photoStageWrapper').style.display = 'block';
      document.getElementById('reviewControls').style.display = 'block';
      initDefaultCorners(img.width, img.height);
      analyzeCapturedImage();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

function initDefaultCorners(w, h) {
  cornerPoints = [
    { x: w * 0.08, y: h * 0.08 },
    { x: w * 0.92, y: h * 0.08 },
    { x: w * 0.92, y: h * 0.92 },
    { x: w * 0.08, y: h * 0.92 }
  ];
}

function toggleCornerPinView() {
  showingPinView = !showingPinView;
  const pinCanvas = document.getElementById('cornerPinCanvas');
  const resCanvas = document.getElementById('resultCanvas');
  if (showingPinView) {
    pinCanvas.style.display = 'block';
    resCanvas.style.display = 'none';
    drawCornerPinCanvas();
  } else {
    pinCanvas.style.display = 'none';
    resCanvas.style.display = 'block';
  }
}

function drawCornerPinCanvas() {
  if (!loadedImage) return;
  const canvas = document.getElementById('cornerPinCanvas');
  canvas.width = loadedImage.width;
  canvas.height = loadedImage.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(loadedImage, 0, 0);

  ctx.strokeStyle = '#22c55e';
  ctx.lineWidth = Math.max(3, canvas.width * 0.005);
  ctx.beginPath();
  cornerPoints.forEach((pt, idx) => {
    if (idx === 0) ctx.moveTo(pt.x, pt.y);
    else ctx.lineTo(pt.x, pt.y);
  });
  ctx.closePath();
  ctx.stroke();

  const radius = Math.max(16, canvas.width * 0.025);
  cornerPoints.forEach((pt) => {
    ctx.fillStyle = 'rgba(37, 99, 235, 0.85)';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.stroke();
  });
}

(function bindCornerDragEvents() {
  const canvas = document.getElementById('cornerPinCanvas');
  if (!canvas) return;

  function getCanvasCoords(evt) {
    const rect = canvas.getBoundingClientRect();
    const touch = evt.touches ? evt.touches[0] : evt;
    return {
      x: (touch.clientX - rect.left) * (canvas.width / rect.width),
      y: (touch.clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function onStart(evt) {
    const pos = getCanvasCoords(evt);
    const hitRadius = Math.max(40, canvas.width * 0.06);
    draggingCornerIdx = cornerPoints.findIndex(
      (pt) => Math.hypot(pt.x - pos.x, pt.y - pos.y) <= hitRadius
    );
    if (draggingCornerIdx >= 0) evt.preventDefault();
  }

  function onMove(evt) {
    if (draggingCornerIdx < 0) return;
    evt.preventDefault();
    const pos = getCanvasCoords(evt);
    cornerPoints[draggingCornerIdx] = {
      x: Math.max(0, Math.min(canvas.width, pos.x)),
      y: Math.max(0, Math.min(canvas.height, pos.y))
    };
    drawCornerPinCanvas();
  }

  function onEnd() {
    draggingCornerIdx = -1;
  }

  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onEnd);
})();

function reanalyzeCapturedImage() {
  showingPinView = false;
  document.getElementById('cornerPinCanvas').style.display = 'none';
  document.getElementById('resultCanvas').style.display = 'block';
  analyzeCapturedImage();
}

function retakeSameStudent() {
  document.getElementById('scoreBanner').style.display = 'none';
  document.getElementById('dupWarningBanner').style.display = 'none';
  triggerPhotoCapture();
}

function nextPaperPhoto() {
  document.getElementById('studentLrn').value = '';
  document.getElementById('studentName').value = '';
  document.getElementById('studentSection').value = '';
  document.getElementById('studentGender').value = 'N/A';
  retakeSameStudent();
}

function analyzeCapturedImage() {
  if (!loadedImage) return;
  const examId = document.getElementById('examSelect').value;
  const keyMeta = allKeysCache.find((k) => k.examId === examId);
  const answerKey = keyMeta ? keyMeta.answers : [];
  const mode = document.getElementById('sectionMode').value;
  const totalItems = mode === 'TERM' ? 50 : 25;

  const canvas = document.getElementById('resultCanvas');
  canvas.style.display = 'block';
  canvas.width = loadedImage.width;
  canvas.height = loadedImage.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(loadedImage, 0, 0);

  // Decode Student QR Code if present
  let detectedLrn = document.getElementById('studentLrn').value;
  let detectedName = document.getElementById('studentName').value || 'Unknown Student';
  let detectedSection = document.getElementById('studentSection').value || 'CPGHS';
  let detectedGender = document.getElementById('studentGender').value || 'N/A';

  if (typeof jsQR === 'function') {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(imgData.data, imgData.width, imgData.height);
    if (qr && qr.data) {
      const parts = qr.data.split('|');
      detectedLrn = (parts[0] || '').trim();
      if (parts[1]) detectedName = parts[1].trim();
      if (parts[2]) detectedSection = parts[2].trim();
      if (parts[3]) detectedGender = parts[3].trim();

      const normLrn = detectedLrn.replace(/\D/g, '').replace(/^0+/, '');
      const student = allStudentsCache.find((s) => String(s.lrn).replace(/\D/g, '').replace(/^0+/, '') === normLrn);
      if (student) {
        detectedLrn = student.lrn;
        detectedName = student.name;
        detectedSection = student.section;
        detectedGender = student.gender;
      }
      document.getElementById('studentLrn').value = detectedLrn;
      document.getElementById('studentName').value = detectedName;
      document.getElementById('studentSection').value = detectedSection;
      document.getElementById('studentGender').value = detectedGender;
    }
  }

  // Evaluate bubbles across normalized ROI
  const choices = ['A', 'B', 'C', 'D'];
  const binaryResults = [];
  let score = 0;

  const minX = Math.min(...cornerPoints.map((p) => p.x));
  const maxX = Math.max(...cornerPoints.map((p) => p.x));
  const minY = Math.min(...cornerPoints.map((p) => p.y));
  const maxY = Math.max(...cornerPoints.map((p) => p.y));
  const roiW = maxX - minX;
  const roiH = maxY - minY;

  const cols = totalItems === 50 ? 2 : 1;
  const rowsPerCol = 25;

  for (let i = 0; i < totalItems; i++) {
    const colIdx = Math.floor(i / rowsPerCol);
    const rowIdx = i % rowsPerCol;
    const baseX = minX + roiW * (cols === 2 ? (colIdx === 0 ? 0.14 : 0.58) : 0.25);
    const colSpan = roiW * (cols === 2 ? 0.30 : 0.55);
    const cy = minY + roiH * (0.24 + (rowIdx / rowsPerCol) * 0.70);
    const sampleR = Math.max(4, Math.round(colSpan * 0.045));

    let darkestVal = 255;
    let selectedChoice = '';
    let selectedCx = 0;

    choices.forEach((ch, cIdx) => {
      const cx = baseX + (cIdx / 3) * colSpan;
      const patch = ctx.getImageData(Math.round(cx - sampleR), Math.round(cy - sampleR), sampleR * 2, sampleR * 2).data;
      let sum = 0;
      for (let p = 0; p < patch.length; p += 4) {
        sum += (patch[p] + patch[p + 1] + patch[p + 2]) / 3;
      }
      const avgLum = sum / (patch.length / 4);
      if (avgLum < darkestVal) {
        darkestVal = avgLum;
        selectedChoice = ch;
        selectedCx = cx;
      }
    });

    const correctAns = (answerKey[i] || '').toUpperCase();
    const isMarked = darkestVal < 175;
    const isCorrect = isMarked && selectedChoice === correctAns;

    if (isCorrect) {
      score++;
      binaryResults.push(1);
    } else {
      binaryResults.push(0);
    }

    // Draw visual grading overlay on canvas
    if (isMarked) {
      ctx.beginPath();
      ctx.arc(selectedCx, cy, sampleR * 1.5, 0, Math.PI * 2);
      ctx.lineWidth = 3;
      ctx.strokeStyle = isCorrect ? '#22c55e' : '#ef4444';
      ctx.stroke();
    }
    if (!isCorrect && correctAns) {
      const keyIdx = choices.indexOf(correctAns);
      if (keyIdx >= 0) {
        const kx = baseX + (keyIdx / 3) * colSpan;
        ctx.beginPath();
        ctx.arc(kx, cy, sampleR * 1.5, 0, Math.PI * 2);
        ctx.lineWidth = 2.5;
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = '#22c55e';
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  const percentage = Number(((score / totalItems) * 100).toFixed(1));
  const fileName = `${examId}_${detectedLrn || 'NO_LRN'}_${Date.now()}.jpg`;

  const payload = {
    examId,
    examType: mode,
    lrn: detectedLrn,
    studentName: detectedName,
    section: detectedSection,
    gender: detectedGender,
    score,
    totalItems,
    percentage,
    imageFileName: fileName,
    binaryResults,
    synced: false,
    timestamp: new Date().toISOString()
  };

  document.getElementById('scanHud').textContent = `Graded: ${detectedName} (${score}/${totalItems})`;
  document.getElementById('detectedStudentBanner').textContent = `Student: ${detectedName} ${detectedLrn ? '(' + detectedLrn + ')' : ''}`;
  document.getElementById('scoreDisplay').textContent = `${score} / ${totalItems} (${percentage}%)`;
  document.getElementById('scoreBanner').style.display = 'block';

  // Duplicate check
  const existingIdx = scanHistory.findIndex(
    (item) => item.examId === examId && item.lrn && item.lrn === detectedLrn
  );
  if (existingIdx >= 0) {
    pendingDuplicatePayload = payload;
    document.getElementById('dupWarningDesc').textContent =
      `${detectedName} (${detectedLrn}) already has a score of ${scanHistory[existingIdx].score}/${totalItems}.`;
    document.getElementById('dupWarningBanner').style.display = 'block';
    return;
  }

  currentPayload = payload;
  recordScanLocally(payload);
  saveCurrentPayload(false);
  saveToPhoneGallery(false);
}

function confirmOverwriteDuplicate() {
  if (!pendingDuplicatePayload) return;
  document.getElementById('dupWarningBanner').style.display = 'none';
  currentPayload = pendingDuplicatePayload;
  pendingDuplicatePayload = null;
  recordScanLocally(currentPayload);
  saveCurrentPayload(false);
  saveToPhoneGallery(false);
}

function skipDuplicatePaper() {
  pendingDuplicatePayload = null;
  document.getElementById('dupWarningBanner').style.display = 'none';
  nextPaperPhoto();
}

function recordScanLocally(payload) {
  const idx = scanHistory.findIndex(
    (item) => item.examId === payload.examId && item.lrn && item.lrn === payload.lrn
  );
  if (idx >= 0) scanHistory[idx] = payload;
  else scanHistory.unshift(payload);

  localStorage.setItem('CPGHS_SCAN_HISTORY', JSON.stringify(scanHistory));
  renderScanHistory();
}

async function saveCurrentPayload(showAlert) {
  if (!currentPayload) return;
  const gasUrl = getGasUrl();
  const statusPill = document.getElementById('driveUploadStatus');

  if (!gasUrl || !sessionToken || sessionToken === 'LOCAL_INIT_SESSION') {
    statusPill.textContent = '💾 Saved locally on device (Connect Google Sheet in Setup to sync).';
    return;
  }

  try {
    statusPill.textContent = '☁️ Syncing score to Google Sheets...';
    const res = await fetch(gasUrl, {
      method: 'POST',
      body: JSON.stringify({ ...currentPayload, token: sessionToken })
    });
    const json = await res.json();
    if (json.status === 'success') {
      currentPayload.synced = true;
      recordScanLocally(currentPayload);
      statusPill.textContent = '✅ Synced to Google Sheets & Saved Locally!';
      if (showAlert) showCenterModal('success', '✅', 'Synced', 'Score successfully saved to Google Sheets.');
    } else {
      statusPill.textContent = '⚠️ Saved locally (Sync pending: ' + (json.message || 'Auth required') + ')';
    }
  } catch (e) {
    statusPill.textContent = '📴 Offline — Saved safely in Local Scan History.';
  }
}

function saveToPhoneGallery(manualClick) {
  const canvas = document.getElementById('resultCanvas');
  if (!canvas || !currentPayload) return;
  try {
    const link = document.createElement('a');
    link.download = currentPayload.imageFileName || 'CPGHS_OMR_Graded.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    if (manualClick) {
      showCenterModal('success', '📱', 'Saved to Gallery', 'Checked answer sheet image downloaded to your device.');
    }
  } catch (e) {
    console.warn('Gallery download skipped:', e);
  }
}

// ============================================================================
// 6. LOCAL SCAN HISTORY & OFFLINE SYNC QUEUE
// ============================================================================
function renderScanHistory() {
  const filterExam = document.getElementById('examSelect').value;
  const filtered = filterExam ? scanHistory.filter((s) => s.examId === filterExam) : scanHistory;
  const pendingCount = scanHistory.filter((s) => !s.synced).length;

  document.getElementById('scannedCountBadge').textContent = `Scanned: ${scanHistory.length}`;
  document.getElementById('pendingBtnCount').textContent = pendingCount;
  const unsyncedBadge = document.getElementById('unsyncedCountBadge');
  unsyncedBadge.style.display = pendingCount > 0 ? 'inline-block' : 'none';
  unsyncedBadge.textContent = `Pending Sync: ${pendingCount}`;

  const tbody = document.querySelector('#scanHistoryTable tbody');
  tbody.innerHTML = '';
  filtered.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td>${item.lrn || '-'}</td>
      <td>${item.studentName}</td>
      <td>${item.examId}</td>
      <td><strong>${item.score}/${item.totalItems}</strong> (${item.percentage}%)</td>
      <td>${item.synced ? '<span class="pill-synced">Synced</span>' : '<span class="pill-pending">Pending</span>'}</td>
      <td><button type="button" class="btn-danger btn-sm" onclick="deleteHistoryRow('${item.timestamp}')">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function deleteHistoryRow(ts) {
  scanHistory = scanHistory.filter((s) => s.timestamp !== ts);
  localStorage.setItem('CPGHS_SCAN_HISTORY', JSON.stringify(scanHistory));
  renderScanHistory();
}

function clearLocalScanHistory() {
  scanHistory = [];
  localStorage.setItem('CPGHS_SCAN_HISTORY', '[]');
  renderScanHistory();
}

async function syncAllPendingScans() {
  const pending = scanHistory.filter((s) => !s.synced);
  if (pending.length === 0) {
    showCenterModal('info', '✅', 'All Synced', 'Every scanned paper is already synced with Google Sheets.');
    return;
  }
  const gasUrl = getGasUrl();
  if (!gasUrl || !sessionToken) return;

  let syncedCount = 0;
  for (const item of pending) {
    try {
      const res = await fetch(gasUrl, {
        method: 'POST',
        body: JSON.stringify({ ...item, token: sessionToken })
      });
      const json = await res.json();
      if (json.status === 'success') {
        item.synced = true;
        syncedCount++;
      }
    } catch (e) {}
  }
  localStorage.setItem('CPGHS_SCAN_HISTORY', JSON.stringify(scanHistory));
  renderScanHistory();
  showCenterModal('success', '☁️', 'Batch Sync Complete', `Synced ${syncedCount} of ${pending.length} pending papers.`);
}

function exportLocalHistoryCsv() {
  if (scanHistory.length === 0) return;
  const rows = [['LRN', 'Student_Name', 'Section', 'Exam_ID', 'Score', 'Total', 'Percentage', 'Timestamp']];
  scanHistory.forEach((s) => {
    rows.push([s.lrn, `"${s.studentName}"`, `"${s.section}"`, s.examId, s.score, s.totalItems, s.percentage, s.timestamp]);
  });
  const blob = new Blob([rows.map((r) => r.join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `CPGHS_Local_Scans_${Date.now()}.csv`;
  a.click();
}

function filterAnalyticsExams(typeFilter, btnEl) {
  document.querySelectorAll('.exam-type-pill').forEach((b) => {
    b.classList.remove('btn-primary');
    b.classList.add('btn-outline');
  });
  if (btnEl) {
    btnEl.classList.remove('btn-outline');
    btnEl.classList.add('btn-primary');
  }
  const sel = document.getElementById('analyticsExamSelect');
  sel.innerHTML = '<option value="">-- Select Exam ID --</option>';
  allKeysCache
    .filter((k) => typeFilter === 'ALL' || k.examType === typeFilter)
    .forEach((k) => {
      const opt = document.createElement('option');
      opt.value = k.examId;
      opt.textContent = `${k.examId} (${k.subject} - ${k.examType})`;
      sel.appendChild(opt);
    });
}

async function loadAnalytics() {
  const examId = document.getElementById('analyticsExamSelect').value;
  const gasUrl = getGasUrl();
  if (!examId || !gasUrl || !sessionToken) return;

  document.getElementById('activeExamMetaBanner').textContent = `Active Report: Loading ${examId}...`;
  document.getElementById('iaExamHeaderBadge').textContent = examId;

  try {
    const res = await fetch(`${gasUrl}?action=getAnalytics&examId=${encodeURIComponent(examId)}&token=${encodeURIComponent(sessionToken)}`);
    const data = await res.json();
    if (data.status !== 'success') {
      document.getElementById('activeExamMetaBanner').textContent = `Active Report: ${examId} (No scores recorded yet)`;
      return;
    }

    lastAnalyticsData = data;
    document.getElementById('activeExamMetaBanner').textContent = `Active Report: ${examId} (${data.summary.totalStudents} Examinees)`;
    document.getElementById('kpiStudents').textContent = data.summary.totalStudents;
    document.getElementById('kpiMps').textContent = data.summary.mps + '%';
    document.getElementById('kpiHigh').textContent = data.summary.highestScore;
    document.getElementById('kpiLow').textContent = data.summary.lowestScore;

    // Populate Item Analysis Table
    const itemBody = document.querySelector('#itemTable tbody');
    itemBody.innerHTML = '';
    (data.itemAnalysis || []).forEach((it) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${it.item}</td>
        <td>${it.correctCount}</td>
        <td>${it.wrongCount}</td>
        <td>${it.masteryPercent}%</td>
        <td>${it.difficultyIndex}</td>
        <td>${it.difficultyLabel}</td>
        <td>${it.discriminationIndex}</td>
        <td><span class="${it.decision === 'Retain' ? 'pill-ok' : 'pill-bad'}">${it.decision}</span></td>
      `;
      itemBody.appendChild(tr);
    });

    // Populate 10 Least Mastered Competencies Table
    const tosBody = document.querySelector('#tosTable tbody');
    tosBody.innerHTML = '';
    (data.tenLeastMastered || []).forEach((c, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${idx + 1}</td>
        <td>${c.code || '-'}</td>
        <td>${c.description || '-'}</td>
        <td>${c.items || '-'}</td>
        <td>${c.masteryPercent}%</td>
        <td><span class="${c.masteryPercent >= 75 ? 'pill-ok' : 'pill-bad'}">${c.status}</span></td>
      `;
      tosBody.appendChild(tr);
    });

    // Populate Student Ranking Table
    const rankBody = document.querySelector('#rankingTable tbody');
    rankBody.innerHTML = '';
    (data.ranking || []).forEach((r) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.rank}</td>
        <td>${r.lrn}</td>
        <td>${r.name}</td>
        <td>${r.section}</td>
        <td>${r.gender}</td>
        <td><strong>${r.score}/${r.totalItems}</strong></td>
        <td>${r.percentage}%</td>
      `;
      rankBody.appendChild(tr);
    });

    renderAnalyticsCharts(data);
  } catch (e) {
    document.getElementById('activeExamMetaBanner').textContent = 'Error loading analytics from server.';
  }
}

function renderAnalyticsCharts(data) {
  if (typeof Chart !== 'function') return;

  if (itemChartInstance) itemChartInstance.destroy();
  itemChartInstance = new Chart(document.getElementById('itemChart'), {
    type: 'bar',
    data: {
      labels: data.itemAnalysis.map((i) => 'Q' + i.item),
      datasets: [{
        label: 'Item Mastery %',
        data: data.itemAnalysis.map((i) => i.masteryPercent),
        backgroundColor: '#2563eb'
      }]
    },
    options: { scales: { y: { beginAtZero: true, max: 100 } } }
  });

  if (compChartInstance) compChartInstance.destroy();
  compChartInstance = new Chart(document.getElementById('competencyChart'), {
    type: 'bar',
    data: {
      labels: data.tenLeastMastered.map((c) => c.code || c.items),
      datasets: [{
        label: 'Competency Mastery %',
        data: data.tenLeastMastered.map((c) => c.masteryPercent),
        backgroundColor: '#dc2626'
      }]
    },
    options: { indexAxis: 'y', scales: { x: { beginAtZero: true, max: 100 } } }
  });

  if (rankChartInstance) rankChartInstance.destroy();
  rankChartInstance = new Chart(document.getElementById('rankingChart'), {
    type: 'line',
    data: {
      labels: data.ranking.slice(0, 20).map((r) => r.name.split(',')[0]),
      datasets: [{
        label: 'Student Score %',
        data: data.ranking.slice(0, 20).map((r) => r.percentage),
        borderColor: '#16a34a',
        tension: 0.25
      }]
    },
    options: { scales: { y: { beginAtZero: true, max: 100 } } }
  });
}

function exportItemAnalysisCsv() {
  if (!lastAnalyticsData || !lastAnalyticsData.itemAnalysis) return;
  const rows = [['Item', 'Correct', 'Wrong', 'Mastery_%', 'Difficulty_p', 'Level', 'Discrimination_D', 'Decision']];
  lastAnalyticsData.itemAnalysis.forEach((i) => {
    rows.push([i.item, i.correctCount, i.wrongCount, i.masteryPercent, i.difficultyIndex, i.difficultyLabel, i.discriminationIndex, i.decision]);
  });
  const blob = new Blob([rows.map((r) => r.join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${lastAnalyticsData.examId}_Item_Analysis.csv`;
  a.click();
}

function addTosCompetencyRow(code = '', comp = '', items = '') {
  const list = document.getElementById('tosCompetencyList');
  const row = document.createElement('div');
  row.className = 'tos-comp-row';
  row.innerHTML = `
    <input type="text" class="tos-comp-desc" placeholder="Competency (e.g. MELC 1: Newton's Laws)" value="${comp}" />
    <input type="text" class="tos-comp-items" placeholder="Items (e.g. 1-5)" value="${items}" />
    <button type="button" class="btn-del-row" onclick="this.parentElement.remove()">✕</button>
  `;
  list.appendChild(row);
}

function syncTosExamIdFromFields() {
  const subjSel = document.getElementById('tosSubject');
  const code = subjSel.options[subjSel.selectedIndex]?.getAttribute('data-code') || '';
  const testType = document.getElementById('tosTestType').value;
  if (!code) return;
  const generatedId = `${code}-${testType}`;
  const examIdSel = document.getElementById('tosExamId');
  if (![...examIdSel.options].some((o) => o.value === generatedId)) {
    const opt = document.createElement('option');
    opt.value = generatedId;
    opt.textContent = generatedId;
    examIdSel.appendChild(opt);
  }
  examIdSel.value = generatedId;
}

function syncTosFromExamId() {
  const examId = document.getElementById('tosExamId').value;
  const existing = allKeysCache.find((k) => k.examId === examId);
  if (!existing) return;
  document.getElementById('tosSubject').value = existing.subject || '';
  document.getElementById('tosTestType').value = existing.examType || 'ST1';
  document.getElementById('tosAnswerKey').value = (existing.answers || []).join(',');
  const list = document.getElementById('tosCompetencyList');
  list.innerHTML = '';
  (existing.competencies || []).forEach((c) => addTosCompetencyRow(c.code, c.competency, c.items));
  if (list.children.length === 0) addTosCompetencyRow();
}

async function saveKeyAndTosToSheet() {
  const gasUrl = getGasUrl();
  if (!gasUrl || !sessionToken) {
    showCenterModal('warning', '⚠️', 'Not Connected', 'Connect your Google Apps Script Web App URL in Setup first.');
    return;
  }

  const exam_id = document.getElementById('tosExamId').value.trim();
  const subject = document.getElementById('tosSubject').value.trim();
  const exam_type = document.getElementById('tosTestType').value.trim();
  const key_string = document.getElementById('tosAnswerKey').value.toUpperCase().replace(/[^A-D,]/g, '');

  if (!exam_id || !key_string) {
    showCenterModal('warning', '📋', 'Missing Fields', 'Select an Exam ID and enter the Answer Key.');
    return;
  }

  const competencies = [];
  document.querySelectorAll('.tos-comp-row').forEach((row, idx) => {
    const competency = row.querySelector('.tos-comp-desc').value.trim();
    const items = row.querySelector('.tos-comp-items').value.trim();
    if (competency || items) {
      competencies.push({ code: `C${idx + 1}`, competency, items });
    }
  });

  try {
    const res = await fetch(gasUrl, {
      method: 'POST',
      body: JSON.stringify({
        action: 'save_tos_and_key',
        token: sessionToken,
        exam_id,
        subject,
        exam_type,
        key_string,
        competencies
      })
    });
    const json = await res.json();
    if (json.status === 'success') {
      await syncKeysAndStudentsFromGoogle(false);
      showCenterModal('success', '✅', 'Saved to Sheet', `Answer Key & TOS for ${exam_id} saved.`);
    } else {
      showCenterModal('danger', '❌', 'Save Failed', json.message || 'Server rejected save.');
    }
  } catch (e) {
    showCenterModal('danger', '❌', 'Network Error', 'Unable to reach Google Sheets.');
  }
}

function lockDevSetup() {
  document.getElementById('devSetupProtectedContent').style.display = 'none';
  document.getElementById('devSetupLockCard').style.display = 'block';
}

let verifiedAdminMasterPin = '';

async function unlockAdminPinPanel() {
  const pin = document.getElementById('adminMasterVerifyInput').value.trim();
  const gasUrl = getGasUrl();
  if (!pin || !gasUrl) return;

  const res = await fetch(`${gasUrl}?action=verifyPin&pin=${encodeURIComponent(pin)}`);
  const json = await res.json();
  if (json.status === 'success' && json.role === 'admin') {
    verifiedAdminMasterPin = pin;
    document.getElementById('adminPinGateBox').style.display = 'none';
    document.getElementById('adminPinControlsBox').style.display = 'block';
  } else {
    showCenterModal('danger', '🔒', 'Access Denied', 'Invalid Admin Master PIN.');
  }
}

async function updateTeacherPin() {
  const p1 = document.getElementById('newPinInput').value.trim();
  const p2 = document.getElementById('confirmPinInput').value.trim();
  if (p1.length < 4 || p1 !== p2) {
    showCenterModal('warning', '⚠️', 'Invalid PIN', 'User PIN must be 4–8 digits and match.');
    return;
  }
  const res = await fetch(getGasUrl(), {
    method: 'POST',
    body: JSON.stringify({
      action: 'update_security_pins',
      adminPin: verifiedAdminMasterPin,
      newUserPin: p1
    })
  });
  const json = await res.json();
  showCenterModal(json.status === 'success' ? 'success' : 'danger', '🔑', 'User PIN Update', json.message);
}

async function updateAdminMasterPin() {
  const p1 = document.getElementById('newAdminPinInput').value.trim();
  const p2 = document.getElementById('confirmAdminPinInput').value.trim();
  if (p1.length < 6 || p1 !== p2) {
    showCenterModal('warning', '⚠️', 'Invalid Admin PIN', 'Admin Master PIN must be 6–10 digits and match.');
    return;
  }
  const res = await fetch(getGasUrl(), {
    method: 'POST',
    body: JSON.stringify({
      action: 'update_security_pins',
      adminPin: verifiedAdminMasterPin,
      newAdminPin: p1
    })
  });
  const json = await res.json();
  if (json.status === 'success') verifiedAdminMasterPin = p1;
  showCenterModal(json.status === 'success' ? 'success' : 'danger', '🛡️', 'Admin PIN Update', json.message);
}
