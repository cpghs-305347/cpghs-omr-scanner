<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPGHS - Automated Assessment & Competency Evaluation Sheet (AACES)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #e2e8f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Screen-Only Toolbar */
    .no-print-toolbar {
      width: 210mm;
      background: #1e3a8a;
      color: #ffffff;
      padding: 12px 16px;
      margin: 12px 0 10px 0;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.12);
      font-size: 12.5px;
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toolbar-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(15, 23, 42, 0.35);
      padding: 8px;
      border-radius: 4px;
    }

    .toolbar-controls select, .toolbar-controls input {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      font-size: 12px;
    }

    .no-print-toolbar button {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 7px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .no-print-toolbar button.btn-blue { background: #3b82f6; }
    .no-print-toolbar button:hover { opacity: 0.9; }

    /* A4 Sheet Container */
    .a4-sheet {
      width: 210mm;
      height: 297mm;
      background: #ffffff;
      padding: 7mm 10mm;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    @media print {
      body { background: none; }
      .no-print-toolbar { display: none !important; }
      .a4-sheet {
        box-shadow: none;
        margin: 0;
        page-break-after: always;
      }
    }

    /* School Header */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }

    .deped-tag { font-size: 7.5pt; font-weight: bold; text-transform: uppercase; color: #334155; }
    .school-name { font-size: 14pt; font-weight: 900; color: #0f172a; line-height: 1.1; }
    .school-address { font-size: 8pt; color: #334155; margin-bottom: 2px; }
    .sheet-title {
      display: inline-block;
      background: #0f172a;
      color: #ffffff;
      font-size: 7.5pt;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 2px;
    }

    /* Student Details & QR Identity Box */
    .top-grid {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr;
      gap: 8px;
      margin-bottom: 6px;
    }

    .meta-box {
      border: 1.2px solid #475569;
      padding: 6px 8px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .field-row {
      display: flex;
      align-items: baseline;
      margin-bottom: 5px;
      font-size: 8pt;
    }

    .field-label {
      font-weight: bold;
      margin-right: 5px;
      white-space: nowrap;
      color: #334155;
    }

    .field-value {
      flex: 1;
      border-bottom: 1px solid #475569;
      font-weight: bold;
      color: #0f172a;
      padding-left: 3px;
      min-height: 12px;
    }

    .instructions-mini {
      background: #f8fafc;
      border-top: 1px dashed #94a3b8;
      padding-top: 4px;
      font-size: 6.8pt;
      line-height: 1.3;
      color: #334155;
    }

    .marking-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
      font-weight: bold;
      color: #0f172a;
    }

    /* Student QR Code Identity Card */
    .student-qr-card {
      border: 1.5px solid #0f172a;
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
    }

    .qr-wrapper {
      width: 96px;
      height: 96px;
      padding: 4px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .qr-details {
      flex: 1;
      font-size: 8pt;
      line-height: 1.45;
    }

    .qr-badge {
      display: inline-block;
      background: #1e3a8a;
      color: #fff;
      font-size: 6.5pt;
      font-weight: bold;
      padding: 1.5px 5px;
      border-radius: 2px;
      margin-bottom: 3px;
    }

    .bubble {
      width: 11.5px;
      height: 11.5px;
      border-radius: 50%;
      border: 1.2px solid #64748b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 6pt;
      font-weight: bold;
      color: #475569;
      background: #ffffff;
    }

    /* OMR Scan Zone with 4 Corner Fiducials */
    .omr-scan-zone {
      position: relative;
      padding: 11mm 11mm;
      border: 1px dashed #cbd5e1;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .fiducial {
      position: absolute;
      width: 9mm;
      height: 9mm;
      background-color: #000000 !important;
      z-index: 10;
    }

    .fiducial.top-left     { top: 1.5mm; left: 1.5mm; }
    .fiducial.top-right    { top: 1.5mm; right: 1.5mm; }
    .fiducial.bottom-left  { bottom: 1.5mm; left: 1.5mm; }
    .fiducial.bottom-right { bottom: 1.5mm; right: 1.5mm; }

    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.95fr;
      gap: 4mm;
      width: 100%;
    }

    .test-section-box {
      border: 1.5px solid #0f172a;
      border-radius: 3px;
      padding: 3px 4px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .section-banner {
      background: #0f172a;
      color: #ffffff;
      font-size: 7pt;
      font-weight: bold;
      text-align: center;
      padding: 2.5px 2px;
      border-radius: 2px;
      margin-bottom: 3px;
      letter-spacing: 0.2px;
    }

    .section-banner.term-banner { background: #1e3a8a; }

    .term-subcolumns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4mm;
    }

    .sub-col-divider {
      border-right: 1px dashed #94a3b8;
      padding-right: 3mm;
    }

    .col-header {
      display: flex;
      justify-content: space-between;
      font-size: 6pt;
      font-weight: bold;
      color: #334155;
      border-bottom: 1px solid #94a3b8;
      padding-bottom: 1.5px;
      margin-bottom: 2px;
      padding-left: 2px;
      padding-right: 4px;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 5.5mm;
      padding: 0 2px;
    }

    .item-row:nth-child(even) { background-color: #f1f5f9; }

    .item-num {
      width: 17px;
      font-size: 7.2pt;
      font-weight: bold;
      color: #0f172a;
      text-align: right;
      margin-right: 4px;
    }

    .bubbles-group {
      display: flex;
      gap: 3px;
      flex: 1;
      justify-content: space-between;
    }

    .section-score-line {
      margin-top: 3px;
      padding-top: 2px;
      border-top: 1px solid #94a3b8;
      font-size: 6.5pt;
      font-weight: bold;
      text-align: right;
      color: #0f172a;
    }

    .sheet-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 6.8pt;
      color: #475569;
      margin-top: 3px;
      border-top: 1px solid #cbd5e1;
      padding-top: 2px;
    }
  </style>
</head>
<body>

  <!-- Screen-Only Print & Student QR Generator Toolbar -->
  <div class="no-print-toolbar">
    <div class="toolbar-top">
      <div><strong>CPGHS QR Answer Sheet Generator</strong> — Set Print Paper Size to <strong>A4</strong> & Margins to <strong>None</strong></div>
      <button onclick="window.print()">🖨️ Print / Save A4 PDF</button>
    </div>
    <div class="toolbar-controls">
      <button class="btn-blue" onclick="loadRosterFromGoogle()">🔄 Load Students from Sheet</button>
      <select id="sectionFilter" onchange="filterBySection()">
        <option value="ALL">All Sections</option>
      </select>
      <select id="studentSelect" onchange="renderSingleSelectedStudent()">
        <option value="">-- Blank Template (No QR) --</option>
      </select>
      <button class="btn-blue" onclick="renderBatchSection()">📑 Generate Entire Section Batch</button>
    </div>
  </div>

  <!-- Container where 1 or N A4 sheets are rendered -->
  <div id="sheetsContainer"></div>

  <script>
    const GAS_URL = localStorage.getItem('cpghs_gas_url') || 'https://script.google.com/macros/s/AKfycbzwRD1b730ttQriRf6F-CBJe9Wm3NsD2MzW5SPuPlnprah4CUjXZElIwImSX8vW3CB7/exec';
    let studentRoster = [];

    function buildItemRows(start, end) {
      let html = '';
      for (let i = start; i <= end; i++) {
        html += `<div class="item-row"><span class="item-num">${i}.</span><div class="bubbles-group"><div class="bubble">A</div><div class="bubble">B</div><div class="bubble">C</div><div class="bubble">D</div></div></div>`;
      }
      return html;
    }

    function createSheetHTML(student, idx) {
      const lrn = student ? student.lrn : '';
      const name = student ? student.name : '';
      const section = student ? student.section : '';
      const gender = student ? student.gender : '';
      const qrDivId = `qr-box-${idx}`;

      return `
      <div class="a4-sheet">
        <div>
          <div class="header-container">
            <div>
              <div class="deped-tag">Republic of the Philippines • Department of Education</div>
              <div class="school-name">CARLOS P. GARCIA HIGH SCHOOL</div>
              <div class="school-address">165 Ermin Garcia St., Cubao, Quezon City</div>
              <div class="sheet-title">AUTOMATED ASSESSMENT & COMPETENCY EVALUATION SHEET (AACES)</div>
            </div>
            <div style="text-align:right; font-size:7pt; color:#475569; font-weight:bold;">
              <div>FORM: CPGHS-QR-3SEC</div>
              <div>S.Y. 2026–2027</div>
            </div>
          </div>

          <div class="top-grid">
            <!-- Left Box: Subject, Teacher, Date & Shading Guide -->
            <div class="meta-box">
              <div>
                <div class="field-row">
                  <span class="field-label">SUBJECT:</span>
                  <div class="field-value"></div>
                  <span class="field-label" style="margin-left:6px;">DATE:</span>
                  <div class="field-value" style="max-width:75px;"></div>
                </div>
                <div class="field-row">
                  <span class="field-label">TEACHER:</span>
                  <div class="field-value"></div>
                </div>
              </div>

              <div class="instructions-mini">
                <strong>INSTRUCTIONS:</strong> Shade the circle completely inside the active test box only (<strong>Summative Test 1</strong>, <strong>Summative Test 2</strong>, or <strong>Term Exam</strong>). Keep the QR code and 4 black corner squares clean.
                <div class="marking-inline">
                  <span>GUIDE:</span>
                  <span><span class="bubble" style="background:#0f172a; border-color:#0f172a;"></span> CORRECT</span>
                  <span><span class="bubble">✓</span> WRONG</span>
                  <span><span class="bubble">✕</span> WRONG</span>
                </div>
              </div>
            </div>

            <!-- Right Box: Student QR Code & Masterlist Info -->
            <div class="student-qr-card">
              <div id="${qrDivId}" class="qr-wrapper" data-lrn="${lrn}">
                ${lrn ? '' : '<span style="font-size:6.5pt; color:#94a3b8; text-align:center;">NO QR<br>(BLANK)</span>'}
              </div>
              <div class="qr-details">
                <div class="qr-badge">STUDENT QR IDENTITY</div>
                <div class="field-row" style="margin-bottom:3px;">
                  <span class="field-label">LRN:</span>
                  <div class="field-value">${lrn}</div>
                </div>
                <div class="field-row" style="margin-bottom:3px;">
                  <span class="field-label">NAME:</span>
                  <div class="field-value" style="font-size:7.5pt;">${name}</div>
                </div>
                <div class="field-row" style="margin-bottom:0;">
                  <span class="field-label">SEC:</span>
                  <div class="field-value" style="margin-right:5px;">${section}</div>
                  <span class="field-label">SEX:</span>
                  <div class="field-value" style="max-width:48px;">${gender}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- OMR Scan Zone with 4 Corner Black Fiducials & 3 Separate Test Sections -->
        <div class="omr-scan-zone">
          <div class="fiducial top-left"></div>
          <div class="fiducial top-right"></div>
          <div class="fiducial bottom-left"></div>
          <div class="fiducial bottom-right"></div>

          <div class="sections-grid">
            <!-- SECTION 1: SUMMATIVE TEST 1 (1-25) -->
            <div class="test-section-box">
              <div class="section-banner">SUMMATIVE TEST 1 (1–25)</div>
              <div class="col-header"><span>NO.</span><span>ANSWERS</span></div>
              ${buildItemRows(1, 25)}
              <div class="section-score-line">ST 1 SCORE: ____ / 25</div>
            </div>

            <!-- SECTION 2: SUMMATIVE TEST 2 (1-25) -->
            <div class="test-section-box">
              <div class="section-banner">SUMMATIVE TEST 2 (1–25)</div>
              <div class="col-header"><span>NO.</span><span>ANSWERS</span></div>
              ${buildItemRows(1, 25)}
              <div class="section-score-line">ST 2 SCORE: ____ / 25</div>
            </div>

            <!-- SECTION 3: TERM EXAM (1-50) -->
            <div class="test-section-box">
              <div class="section-banner term-banner">TERM EXAM (ITEMS 1–50)</div>
              <div class="term-subcolumns">
                <div class="sub-col-divider">
                  <div class="col-header"><span>NO.</span><span>ANSWERS</span></div>
                  ${buildItemRows(1, 25)}
                </div>
                <div>
                  <div class="col-header"><span>NO.</span><span>ANSWERS</span></div>
                  ${buildItemRows(26, 50)}
                </div>
              </div>
              <div class="section-score-line">TERM EXAM SCORE: ____ / 50</div>
            </div>
          </div>
        </div>

        <div class="sheet-footer">
          <span>CPGHS-AACES • 3-Section QR Assessment Form (ST1 • ST2 • Term Exam)</span>
          <span>Keep Student QR & all 4 black corner squares unobstructed</span>
        </div>
      </div>`;
    }

    function renderSheets(studentsArray) {
      const container = document.getElementById('sheetsContainer');
      if (!studentsArray || studentsArray.length === 0) {
        container.innerHTML = createSheetHTML(null, 0);
        return;
      }

      container.innerHTML = studentsArray.map((st, idx) => createSheetHTML(st, idx)).join('');

      studentsArray.forEach((st, idx) => {
        if (st && st.lrn) {
          const el = document.getElementById(`qr-box-${idx}`);
          el.innerHTML = '';
          new QRCode(el, {
            text: st.lrn,
            width: 86,
            height: 86,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        }
      });
    }

    async function loadRosterFromGoogle() {
      try {
        const res = await fetch(`${GAS_URL}?action=getStudents`);
        const data = await res.json();
        if (data.status === 'success' && Array.isArray(data.students)) {
          studentRoster = data.students;
          localStorage.setItem('cpghs_students', JSON.stringify(studentRoster));
          populateRosterSelectors();
          alert(`Loaded ${studentRoster.length} students from Google Sheets!`);
        }
      } catch (e) {
        alert('Could not fetch Students tab. Check your Apps Script deployment.');
      }
    }

    function populateRosterSelectors() {
      const secSelect = document.getElementById('sectionFilter');
      const sections = [...new Set(studentRoster.map(s => s.section).filter(Boolean))];
      secSelect.innerHTML = '<option value="ALL">All Sections</option>';
      sections.forEach(sec => secSelect.add(new Option(sec, sec)));
      filterBySection();
    }

    function filterBySection() {
      const sec = document.getElementById('sectionFilter').value;
      const stSelect = document.getElementById('studentSelect');
      stSelect.innerHTML = '<option value="">-- Blank Template (No QR) --</option>';

      const filtered = sec === 'ALL' ? studentRoster : studentRoster.filter(s => s.section === sec);
      filtered.forEach(st => {
        stSelect.add(new Option(`${st.name} (${st.lrn})`, st.lrn));
      });
    }

    function renderSingleSelectedStudent() {
      const lrn = document.getElementById('studentSelect').value;
      if (!lrn) {
        renderSheets([]);
        return;
      }
      const st = studentRoster.find(s => s.lrn === lrn);
      renderSheets(st ? [st] : []);
    }

    function renderBatchSection() {
      const sec = document.getElementById('sectionFilter').value;
      const filtered = sec === 'ALL' ? studentRoster : studentRoster.filter(s => s.section === sec);
      if (filtered.length === 0) {
        alert('No students loaded yet. Click "Load Students from Sheet" first.');
        return;
      }
      renderSheets(filtered);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const cached = localStorage.getItem('cpghs_students');
      if (cached) {
        studentRoster = JSON.parse(cached);
        populateRosterSelectors();
      }
      renderSheets([]);
    });
  </script>
</body>
</html>
